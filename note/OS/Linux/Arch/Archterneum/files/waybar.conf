// -*- mode: jsonc -*-
{
    "layer": "top",
    "position": "bottom",
    "height": 30,
    "spacing": 5,
    "modules-left": [
        "custom/rofi",
        "custom/pacman",
        "wlr/taskbar",
    ],
    "wlr/taskbar": {
        "format": "{icon}",
        "icon-size": 24,
        "tooltip": true,
        "tooltip-format": "{title}",
        "on-click": "hyprctl --batch 'dispatch focuswindow address:{address}; dispatch alterzorder top'",
        "on-click-middle": "hyprctl dispatch closewindow address:{address}",
        "on-click-right": "",
    },
    "modules-center": [
        "hyprland/window",
    ],
    "modules-right": [
        //"mpd",
        "idle_inhibitor",
        "pulseaudio",
        //"wireplumber",
        "network",
        //"power-profiles-daemon",
        "cpu",
        "custom/cpulogo",
        "custom/tempcpu",
        "memory",
        "custom/gpuload",
        "custom/gpulogo",
        "custom/gputemperature",
        "custom/fan",
        //"backlight",
        "keyboard-state",
        //"sway/language",
        //"battery",
        //"battery#bat2",
        "clock",
        "tray",
        "custom/power"
    ],
    "sway/workspaces": {
        "disable-scroll": true,
        "all-outputs": true,
        "warp-on-scroll": false,
        "format": "{name}: {icon}",
        "format-icons": {
            "1": "",
            "2": "",
            "3": "",
            "4": "",
            "5": "",
            "urgent": "",
            "focused": "",
            "default": ""
        }
    },
    "custom/rofi": {
        "format": "󰣇",
        "on-click": "~/.config/rofi/start.sh",
        "tooltip": false,
    },
    "custom/pacman": {
        "format": "{text} 📦️",
        "tooltip-format": "{text} 📦️ update",
        "interval": 900,
        "exec": "sudo rm /var/lib/pacman/db.lck ; sudo pacman -Sy &>/dev/null ; yay -Sy &>/dev/null ; echo $(($(pacman -Qu | wc -l) + $(yay -Qu | wc -l)))",
        "exec-if": "exit 0",
        "on-click": "xfce4-terminal --hide-menubar --hide-toolbar --hide-scrollbar --execute ~/.config/waybar/pacman_updater.sh",
        "signal": 8
    },
    "keyboard-state": {
        "numlock": true,
        "capslock": true,
        "format": "{name} {icon}",
        "format-icons": {
            "locked": "",
            "unlocked": ""
        }
    },
    "sway/mode": {
        "format": "<span style=\"italic\">{}</span>"
    },
    "sway/scratchpad": {
        "format": "{icon} {count}",
        "show-empty": false,
        "format-icons": ["", ""],
        "tooltip": true,
        "tooltip-format": "{app}: {title}"
    },
    "hyprland/window": {
        "format": "{title}",
        "max-length": 24,
        "icon": true,
        "rewrite": {
            "(.*) – Brave": "$1",
            "(.*) - Discord": "$1",
            "Terminal - (.*)": "$1",
        },
    },
    "wlr/taskbar": {
        "format": "{icon}",
        "tooltip-format": "{name} : {title}",
        "on-click": "activate",
        "on-click-middle": "close",
        "on-click-right": "hyprctl dispatch movetoworkspacesilent current,"
    },
    "mpd": {
        "format": "{stateIcon} {consumeIcon}{randomIcon}{repeatIcon}{singleIcon}{artist} - {album} - {title} ({elapsedTime:%M:%S}/{totalTime:%M:%S}) ⸨{songPosition}|{queueLength}⸩ {volume}% ",
        "format-disconnected": "Disconnected ",
        "format-stopped": "{consumeIcon}{randomIcon}{repeatIcon}{singleIcon}Stopped ",
        "unknown-tag": "N/A",
        "interval": 5,
        "consume-icons": {
            "on": " "
        },
        "random-icons": {
            "off": "<span color=\"#f53c3c\"></span> ",
            "on": " "
        },
        "repeat-icons": {
            "on": " "
        },
        "single-icons": {
            "on": "1 "
        },
        "state-icons": {
            "paused": "",
            "playing": ""
        },
        "tooltip-format": "MPD (connected)",
        "tooltip-format-disconnected": "MPD (disconnected)"
    },
    "idle_inhibitor": {
        "format": "{icon}",
        "tooltip": false,
        "format-icons": {
            "activated": "💤 ❌",
            "deactivated": "💤 ✔️"
        },
    },
    "tray": {
        "icon-size": 21,
        "spacing": 10,
        "icons": {
            "Steam": "~/.local/share/icons/hicolor/16x16/apps/steam_icon_70.png",
            "discord": "/opt/discord/discord.png",
            "vencord": "/opt/discord/discord.png",
        }
    },
    "clock": {
        "tooltip-format": "<big>{:%Y %B}</big>\n<tt><big>{calendar}</big></tt>",
        "format": "{:%d/%m %H:%M:%S}",
        "interval": 1
    },
    "cpu": {
        "format": "{usage:02}%",
        "interval": 1,
        "tooltip": false,
    },
    "custom/cpulogo": {
        "format": ""
    },
    "custom/tempcpu": {
        "exec": "~/gpu_scan.sh CPU temp",
        "exec-if": "exit 0",
        "format": "{text}°C",
        "interval": 1,
        "tooltip": false,
    },
    "memory": {
        "format": "{used:0.1f}G/{total:0.1f}G ",
        "interval": 1,
        "tooltip": false,
    },
    "custom/gputemperature": {
        "exec": "~/gpu_scan.sh GPU temp",
        "exec-if": "exit 0",
        "format": "{text}°C",
        "interval": 1,
        "tooltip": false,
    },
    "custom/gpulogo": {
        "format": "󰢮"
    },
    "custom/gpuload": {
        "exec": "~/gpu_scan.sh GPU load",
        "exec-if": "exit 0",
        "format": "{text}%",
        "interval": 1,
        "tooltip": false,
    },
    "custom/fan": {
        "format": "{text} ",
        "interval": 1,
        "tooltip": false,
        "exec": "~/gpu_scan.sh GPU fan",
        "exec-if": "exit 0",
    },
    "backlight": {
        // "device": "acpi_video1",
        "format": "{percent}% {icon}",
        "format-icons": ["", "", "", "", "", "", "", "", ""]
    },
    "battery": {
        "states": {
            // "good": 95,
            "warning": 30,
            "critical": 15
        },
        "format": "{capacity}% {icon}",
        "format-full": "{capacity}% {icon}",
        "format-charging": "{capacity}% ",
        "format-plugged": "{capacity}% ",
        "format-alt": "{time} {icon}",
        // "format-good": "", // An empty format will hide the module
        // "format-full": "",
        "format-icons": ["", "", "", "", ""]
    },
    "battery#bat2": {
        "bat": "BAT2"
    },
    "power-profiles-daemon": {
      "format": "{icon}",
      "tooltip-format": "Power profile: {profile}\nDriver: {driver}",
      "tooltip": true,
      "format-icons": {
        "default": "",
        "performance": "",
        "balanced": "",
        "power-saver": ""
      }
    },
    "network": {
        // "interface": "wlp2*", // (Optional) To force the use of this interface
        "format-wifi": "{essid} ({signalStrength}%) ",
        "format-ethernet": "{ipaddr}/{cidr}   {bandwidthDownBytes:<}  {bandwidthUpBytes:<}",
        "tooltip-format": "{ifname} via {gwaddr} ",
        "format-linked": "{ifname} (No IP) ",
        "format-disconnected": "Disconnected ⚠",
        "format-alt": "{ifname}: {ipaddr}/{cidr}",
        "interval": 1,
    },
    "pulseaudio": {
        "scroll-step": 5,
        "format": "{volume}% {icon}  {format_source}",
        "format-bluetooth": "{volume}% {icon} {format_source}",
        "format-bluetooth-muted": " {icon} {format_source}",
        "format-muted": " {format_source}",
        "format-source": "{volume}% ",
        "format-source-muted": "",
        "format-icons": {
            "headphone": "",
            "hands-free": "",
            "headset": "",
            "phone": "",
            "portable": "",
            "car": "",
            "default": ["", "", ""]
        },
        "on-click": "pavucontrol"
    },
    "wireplumber": {
        "format": "{icon} {volume}%",
        "format-muted": " ",
        "on-click": "~/.config/hypr/scripts/Volume.sh --toggle",
        "on-click-right": "pavucontrol -t 3",
        "on-scroll-up": "~/.config/hypr/scripts/Volume.sh --inc",
        "on-scroll-down": "~/.config/hypr/scripts/Volume.sh --dec",
        "format-icons": ["", "", "󰕾", ""], 
        "max-volume": 140,
    },
    "wireplumber#microphone": {
        "format": " {volume}%",
        "format-muted": "",
        "on-click": "~/.config/hypr/scripts/Volume.sh --toggle-mic",
        "on-click-right": "pavucontrol -t 4",
        "on-scroll-up": "~/.config/hypr/scripts/Volume.sh --mic-inc",
        "on-scroll-down": "~/.config/hypr/scripts/Volume.sh --mic-dec",
        "tooltip-format": "{source_desc} | {source_volume}%",
        "scroll-step": 5,
    },
    "custom/media": {
        "format": "{icon} {text}",
        "return-type": "json",
        "max-length": 40,
        "format-icons": {
            "spotify": "",
            "default": "🎜"
        },
        "escape": true,
        "exec": "$HOME/.config/waybar/mediaplayer.py 2> /dev/null" // Script in resources folder
        // "exec": "$HOME/.config/waybar/mediaplayer.py --player spotify 2> /dev/null" // Filter player based on name
    },
    "custom/power": {
        "format" : "⏻",
		"tooltip": false,
		"menu": "on-click",
		"menu-file": "$HOME/.config/waybar/power_menu.xml", // Menu file in resources folder
		"menu-actions": {
			"shutdown": "shutdown",
			"reboot": "reboot",
			"suspend": "systemctl suspend",
			"hibernate": "systemctl hibernate"
		}
    }
}